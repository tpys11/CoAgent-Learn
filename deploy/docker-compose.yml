services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: guashuai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - guashuai-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: guashuai-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    command: sh -c "pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --quiet psycopg2-binary neo4j rank_bm25 jieba sentence-transformers pypdf python-docx python-pptx python-multipart && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../backend:/app
      - ../agents:/app/agents
      - ../skills:/app/skills
      - ../data:/app/data
      - ../chroma_db:/app/chroma_db
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_started
      postgres:
        condition: service_started
      neo4j:
        condition: service_started
    networks:
      - guashuai-network

  redis:
    image: redis:7-alpine
    container_name: guashuai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - guashuai-network

  chroma:
    image: chromadb/chroma:latest
    container_name: guashuai-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - guashuai-network
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guashuai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coagent
      POSTGRES_USER: coagent
      POSTGRES_PASSWORD: coagent123
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - guashuai-network
  neo4j:
    image: neo4j:latest
    container_name: guashuai-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j123
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - guashuai-network

volumes:
  redis_data:
  chroma_data:

networks:
  guashuai-network:
    driver: bridge
