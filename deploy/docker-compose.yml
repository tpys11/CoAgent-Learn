services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: guashuai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/index.html:/app/index.html
      - ../frontend/public:/app/public
      - ../frontend/package.json:/app/package.json
      - ../frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - backend
    networks:
      - guashuai-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: guashuai-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # 主数据统一落地宿主机仓库根 data/（与本地 start-backend.bat 同库，终结双库分叉）
      - SQLITE_DIR=/app-data
    # C1: 依赖全部由镜像构建期提供（backend/requirements.txt），启动零联网安装。
    # 勿在运行时联网装包——断网即挂（Step C1 实测）；新增运行时依赖进 requirements.txt 后 --build 重建。
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ../backend:/app
      - ../skills:/app/skills
      - ../tests:/app/tests
      - ../data:/app-data
    networks:
      - guashuai-network

networks:
  guashuai-network:
    driver: bridge
