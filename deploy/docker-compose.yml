services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: guashuai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/index.html:/app/index.html
      - ../frontend/public:/app/public
      - ../frontend/package.json:/app/package.json
      - ../frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - backend
    networks:
      - guashuai-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: guashuai-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    command: sh -c "pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --quiet sqlite-vec python-multipart pypdf python-docx python-pptx rank_bm25 jieba pytest pymupdf4llm trafilatura markitdown llama-index-core && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../backend:/app
      - ../agents:/app/agents
      - ../skills:/app/skills
      - ../tests:/app/tests
      - coagent-kbdata:/app/data
    networks:
      - guashuai-network

networks:
  guashuai-network:
    driver: bridge

volumes:
  coagent-kbdata:
    name: coagent-kbdata
