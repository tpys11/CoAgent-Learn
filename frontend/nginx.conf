# CoAgent-Learn 前端生产配置（Step C3）
# 由 frontend/Dockerfile 拷入镜像 /etc/nginx/conf.d/default.conf
# 流式红线：/api 的缓冲/缓存/超时任何回退都会让 SSE 流式静默失效
# （守卫：tests/test_c3_nginx_config.py；分析：Step C3 交接文档 4.4）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库 PDF/图片上传：nginx 默认 1m 会对 3MB PDF 直接 413（后端自身上限 50MB）
    client_max_body_size 100m;

    # Vite 产物 assets/ 文件名带内容哈希：长缓存安全
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # F13-S3：pdf.js worker 是 .mjs 模块脚本——nginx 默认 MIME 表无 .mjs（回退
    # application/octet-stream 会被浏览器 Strict MIME 拒载，阅读器 worker 起不来）
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback + index.html 不缓存（当前前端无路由，fallback 零成本保留；
    # no-cache 保证评委刷新即拿到最新页面）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 后端 API 反代（含 /api/chat SSE 长连接）
    location /api/ {
        # 不带 URI：/api/... 原样转发（后端路由自带 /api 前缀，与 vite dev 代理语义一致）
        proxy_pass http://guashuai-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式三件套：关缓冲/关缓存 + 长超时（长对话 SSE 连接不被中途切断）
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 上传文件静态回显（知识库命中图片 <img src="/uploads/...">）
    location /uploads/ {
        proxy_pass http://guashuai-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # F13-S1 预设资源库原始文件回源（阅读器/下载/加入课程取文件；与 /uploads 同模式）
    location /preset-library/ {
        proxy_pass http://guashuai-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
